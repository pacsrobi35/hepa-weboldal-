name: Compact why us section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact why us cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changes = {
              'padding: 90px 8%;': 'padding: 76px 8%;',
              'margin: 0 auto 50px;': 'margin: 0 auto 38px;',
              'gap: 20px;': 'gap: 18px;',
              'padding: 32px 26px 30px;': 'padding: 26px 24px 24px;',
              'margin-bottom: 22px;': 'margin-bottom: 14px;',
              'font-size: 22px;': 'font-size: 20px;',
              'margin-bottom: 12px;\n    color: white;': 'margin-bottom: 10px;\n    color: white;'
          }
          for old, new in changes.items():
              if old not in s:
                  raise RuntimeError(f'Expected CSS not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit compact layout
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Miért minket szekció kompaktabb kialakítása'
            git push
          fi
