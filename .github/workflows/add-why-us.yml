name: Add why us section

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add why us section
        env:
          CSS_B64: Lyo 
          SECTION_B64:  sZXNzZW4uCiAgICAgICAgICAgICAgICA8L3A+CiAgICAgICAgICAgIDwvZGl2PgoKICAgICAgICAgICAgPGRpdiBjbGFzcz0id2h5LXVzLWdyaWQiPgogICAgICAgICAgICAgICAgPGFydGljbGUgY2xhc3M9IndoeS11cy1jYXJkIj4KICAgICAgICAgICAgICAgICAgICA8ZGl2IGNsYXNzPSJ3aHktdXMtbnVtYmVyIj4wMTwvZGl2PgogICAgICAgICAgICAgICAgICAgIDxoMz5TYWrDoXQgbcWx aGVseTwvaDM+CiAgICAgICAgICAgICAgICAgICAgPHA+QSBiw7p0b3JvayBnecOhcnTDqXPDqXQg w6lzIGVsw7Frw6lzesOtdMOpc8OpdCBzYWrDoXQgbcWx aGVsecO8bmt  sIGEgbGFwc3phYsOhc29uIMOhdCBhIHN6ZXJlbMOp  w6lzIGtpYWxha8OtdMOhc8OhdCBheiBhZ G90dCBoZWx5aGV6IMOpcyBpZ8OpbnloZXogaWdhesOtdGp1ay48L3A+CiAgICAgICAgICAgICAgICA8L2FydGljbGU+CgogICAgICAgICAgICAgICAgPGFydGljbGUgY2xhc3M9IndoeS11cy1jYXJkIj4KICAgICAgICAgICAgICAgICAgICA8ZGl2IGNsYXNzPSJ3aHktdXMtbnVtYmVyIj4wNDwvZGl2PgogICAgICAgICAgICAgICAgICAgIDxoMz5FZ3kga8Opei bZW4gYSBmb2x5YW1hdDwvaDM+CiAgICAgICAgICAgICAgICAgICAgPHA+RWd5ZXp0ZXTDqXMsIHRlcnZlesOpcywgZ3nDoXJ0w6FzLCBzesOhbGzDrXTDoXMg w6lzIHN6ZXJlbMOpcy4gQSB0ZWxqZXMgZm9seWFtYXRvdCB2w6lnaWcga8O2dmV0aGV0xZF lbiBrZXplbGrDvGsuPC9wPgogICAgICAgICAgICAgICAgPC9hcnRpY2xlPgogICAgICAgICAgICA8L2Rpdj4KICAgICAgICA8L2Rpdj4KICAgIDwvc2VjdGlvbj4K
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'id="miert-minket"' in html:
              print('Section already exists')
              raise SystemExit(0)

          css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')

          if '</style>' not in html:
              raise RuntimeError('Closing style tag not found')
          html = html.replace('</style>', css + '\n    </style>', 1)

          marker = '    <!-- LAPSZABÁSZAT -->'
          if marker not in html:
              marker = '<!-- LAPSZABÁSZAT -->'
          if marker not in html:
              raise RuntimeError('Lapszabaszat marker not found')
          html = html.replace(marker, section + '\n\n' + marker, 1)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Miért minket szekció hozzáadása"
            git push
          fi
