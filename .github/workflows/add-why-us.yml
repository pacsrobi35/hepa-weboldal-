name: Add why us section

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add why us section
        env:
          CSS_B64: 
          SECTION_B64: 
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          if 'id="miert-minket"' in html:
              print('Section already exists')
              raise SystemExit(0)
          css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          if '</style>' not in html:
              raise RuntimeError('Closing style tag not found')
          html = html.replace('</style>', css + '\n    </style>', 1)
          marker = '    <!-- LAPSZABÁSZAT -->'
          if marker not in html:
              marker = '<!-- LAPSZABÁSZAT -->'
          if marker not in html:
              raise RuntimeError('Lapszabaszat marker not found')
          html = html.replace(marker, section + '\n\n' + marker, 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Miért minket szekció hozzáadása"
            git push
          fi
