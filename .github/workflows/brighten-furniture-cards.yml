name: Brighten furniture cards

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  brighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brighten the category cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('background: rgba(0, 0, 0, 0.45);', 'background: rgba(0, 0, 0, 0.16);')
          s = s.replace('background: rgba(0, 0, 0, 0.25);', 'background: rgba(0, 0, 0, 0.06);')
          s = s.replace('box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);', 'box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Világosabb bútor kategória kártyák'
            git push
          fi
