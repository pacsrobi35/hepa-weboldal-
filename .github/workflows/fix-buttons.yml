name: Fix button JavaScript
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair script structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''\n   <script>\nfunction toggleMenu() {\n    document.getElementById("main-nav").classList.toggle("active");\n}\n</script>\n\n</body>'''
          new='''\n        function toggleMenu() {\n            document.getElementById("main-nav").classList.toggle("active");\n        }\n    </script>\n\n</body>'''
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Javítás: bútor kategória gombok működése'
            git push
          fi
